name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build kanban-cli/Kanban.sln -c Release

      - name: Test
        run: dotnet test kanban-cli/Kanban.sln -c Release --no-build --verbosity normal
