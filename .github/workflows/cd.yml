name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-win-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Windows x86
        run: dotnet publish kanban-cli/Kanban.sln -c Release -r win-x86 --self-contained false

      - name: Zip publish output
        run: |
          set -euo pipefail
          stage="artifacts/win-x86"
          rm -rf "$stage"
          mkdir -p "$stage"
          copy_publish() {
            local project_dir="$1"
            local name="$2"
            local src="${project_dir}/bin/Release/net10.0/win-x86/publish"
            if [[ ! -d "$src" ]]; then
              echo "Publish directory not found: $src" >&2
              exit 1
            fi
            mkdir -p "${stage}/${name}"
            cp -a "${src}/." "${stage}/${name}/"
          }
          copy_publish "kanban-cli/src/Kanban.Api" "Kanban.Api"
          copy_publish "kanban-cli/src/Kanban.Cli" "Kanban.Cli"
          copy_publish "kanban-cli/src/UserProfile.Api" "UserProfile.Api"
          cp Dockerfile "$stage/"
          cp -r docker "$stage/docker"
          cp docker-compose.yml "$stage/"
          rm -f kanban-win-x86.zip
          (cd "$stage" && zip -r "../../kanban-win-x86.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanban-win-x86
          path: kanban-win-x86.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            kanban-win-x86.zip \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Релиз ${GITHUB_REF_NAME}. Архив — framework-dependent сборка Windows x86 (win-x86, self-contained false): Kanban.Api, Kanban.Cli, UserProfile.Api."
